services:
  stig-explorer:
    build: .
    image: stig-explorer:latest
    container_name: stig-explorer
    # Bound to localhost only. Change to "8080:8080" to expose on the network.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      STIGX_QUIET: "0"
    restart: unless-stopped
